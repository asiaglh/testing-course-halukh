name: static-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install uv==0.13.7
      - run: uv run --project app ruff check --output-format=github app
      - run: uv run --project app ruff format --check app
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install uv==0.13.7
      - name: Install Chromium for E2E tests
        working-directory: app
        run: uv run playwright install --with-deps chromium
      - name: Run tests with branch coverage
        working-directory: app
        run: uv run pytest --tracing retain-on-failure --cov --cov-report=term-missing --cov-report=html -rxX
      - name: Require full retake coverage
        working-directory: app
        run: uv run coverage report --include='*/retake.py' --fail-under=100
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: app/htmlcov/
          if-no-files-found: ignore
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: app/test-results/
          if-no-files-found: ignore
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install semgrep==1.184.0
      - run: semgrep scan --config p/python --config rules/ --error --metrics=off app/
